schema_version = "1.3"

[task]
name = "skillbench/lc-ecosystem-bootstrap"
description = "Ecosystem bootstrap: given a branching+HITL project description, Claude must pick LangGraph and produce both install.sh and .env.example with the right packages and observability vars"

[metadata]
source_task = "lc-ecosystem-bootstrap"
difficulty = "medium"
category = "langchain"
tags = ["langgraph", "ecosystem-primer", "framework-selection", "install", "env-vars", "langsmith"]

[agent]
timeout_sec = 240.0

[verifier]
timeout_sec = 120.0
user = "root"

[environment]
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 65536
# skills_dir = "skills"  # Phase 1: per-treatment skills copied to the agent skills config dir
