schema_version = "1.3"

[task]
name = "skillbench/lc-framework-middleware-agent"
description = "Framework selection: build an agent with pre/post hooks — Claude must pick create_agent (or create_deep_agent), NOT LangGraph"

[metadata]
source_task = "lc-framework-middleware-agent"
difficulty = "medium"
category = "langchain"
tags = ["langchain", "langgraph", "deep-agents", "framework-selection", "middleware"]

[agent]
timeout_sec = 180.0

[verifier]
timeout_sec = 120.0
user = "root"

[environment]
build_timeout_sec = 1800.0
workdir = "/workspace"
cpus = 4
memory_mb = 8192
storage_mb = 65536
# skills_dir = "skills"  # Phase 1: per-treatment skills copied to the agent skills config dir
