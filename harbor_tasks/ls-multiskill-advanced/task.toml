schema_version = "1.3"

[task]
name = "skillbench/ls-multiskill-advanced"
description = "Create trajectory dataset and evaluator from LangSmith traces"

[metadata]
source_task = "ls-multiskill-advanced"
difficulty = "hard"
category = "langsmith"
tags = ["multiskill", "trace", "dataset", "evaluator"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 120.0
user = "root"

[verifier.env]
LANGSMITH_API_KEY = "${LANGSMITH_API_KEY}"

[environment]
build_timeout_sec = 600.0
workdir = "/workspace"
